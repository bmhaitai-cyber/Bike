<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 실내자전거</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one-screen bike computer — status bar, big gear dial with ± pads, 2x3 metric grid */
:root{
  --bg:#eef2f1; --panel:#ffffff; --fg:#13201e; --muted:#5d6c69; --line:#d3dcda;
  --accent:#0b7d74; --accent-ink:#ffffff; --warn:#b4541a; --ok:#1d7a3e;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --panel:#16201f; --fg:#e6efed; --muted:#8fa19d; --line:#263533;
  --accent:#2ec4b6; --accent-ink:#04201d; --warn:#f0954f; --ok:#5ccf86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --panel:#16201f; --fg:#e6efed; --muted:#8fa19d; --line:#263533;
  --accent:#2ec4b6; --accent-ink:#04201d; --warn:#f0954f; --ok:#5ccf86; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 24px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 1.5rem/1 var(--display);letter-spacing:.02em;margin:0}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.status.on .dot{background:var(--ok)}
.status.err .dot{background:var(--warn)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:14px 18px;font-size:1rem;width:100%}

.gear{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.pad{height:96px;font:700 3rem/1 var(--display);background:var(--bg);color:var(--fg);border:1px solid var(--line);
  touch-action:manipulation;user-select:none}
.pad:active:not(:disabled){background:var(--accent);color:var(--accent-ink)}
.dial{text-align:center;min-width:110px}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gearnum{font:700 5rem/0.95 var(--display);font-variant-numeric:tabular-nums}
.gearof{font:500 1rem var(--display);color:var(--muted)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden}
.m{background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.v{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.u{font-size:.72rem;color:var(--muted)}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}

details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem}
summary{cursor:pointer;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#log{margin-top:10px;max-height:160px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap}
.msg{font-size:.88rem;color:var(--warn);line-height:1.5}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 12px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>내 실내자전거</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">연결 안 됨</span></div>
  </header>

  <p class="msg" id="unsupported" hidden></p>
  <button class="primary" id="connect">자전거 연결</button>

  <section class="gear" aria-label="기어">
    <button class="pad" id="down" disabled aria-label="기어 내리기">−</button>
    <div class="dial">
      <div class="label">기어</div>
      <div class="gearnum" id="gear">–</div>
      <div class="gearof" id="gearOf">/ –</div>
    </div>
    <button class="pad" id="up" disabled aria-label="기어 올리기">+</button>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <section class="grid" aria-label="운동 데이터">
    <div class="m"><span class="label">속도</span><span class="v" id="speed">0.0</span><span class="u">km/h</span></div>
    <div class="m"><span class="label">케이던스</span><span class="v" id="cad">0</span><span class="u">rpm</span></div>
    <div class="m"><span class="label">파워</span><span class="v" id="pow">0</span><span class="u">W</span></div>
    <div class="m"><span class="label">시간</span><span class="v" id="time">0:00</span><span class="u">분:초</span></div>
    <div class="m"><span class="label">거리</span><span class="v" id="dist">0.00</span><span class="u">km</span></div>
    <div class="m"><span class="label">칼로리</span><span class="v" id="kcal">0</span><span class="u">kcal</span></div>
  </section>

  <details>
    <summary>설정 · 문제 해결</summary>
    <div class="row">
      <label for="fmt">기어 명령 형식</label>
      <select id="fmt">
        <option value="auto">자동 (권장)</option>
        <option value="s16">표준 16비트</option>
        <option value="u8">8비트 ×10</option>
        <option value="u8raw">8비트 그대로</option>
      </select>
    </div>
    <div class="row">
      <button class="ghost" id="reset">기록 초기화</button>
      <button class="ghost" id="disc" disabled>연결 끊기</button>
    </div>
    <div id="log"></div>
  </details>
</div>

<script>
const FTMS=0x1826, C_BIKE=0x2ad2, C_CP=0x2ad9, C_RANGE=0x2ad6, C_STATUS=0x2ada;
const $=id=>document.getElementById(id);
let dev=null, cp=null, range={min:0,max:100,inc:10}, level=null, fmt='auto', fmtWorking=null;
let pending=null, wake=null;
const st={speed:0,cad:0,pow:0,dist:0,kcal:0,bikeTime:null};
let t0=null, distLocal=0, lastTick=null;

try{fmt=localStorage.getItem('fmt')||'auto';}catch(e){}
$('fmt').value=fmt;

function log(s){const l=$('log');l.textContent=(new Date().toLocaleTimeString()+'  '+s+'\n')+l.textContent;}
function setStatus(txt,cls){$('statusText').textContent=txt;$('status').className='status '+(cls||'');}

if(!navigator.bluetooth){
  $('unsupported').hidden=false;
  $('unsupported').textContent='이 화면에서는 블루투스를 쓸 수 없어요. 안드로이드 크롬(또는 PC 크롬/엣지)에서 이 파일을 https 주소로 열어주세요.';
}

// ---- gears ----
function steps(){return Math.max(1,Math.round((range.max-range.min)/range.inc));}
function gearIdx(){return level==null?null:Math.round((level-range.min)/range.inc);}
function render(){
  const n=steps(), i=gearIdx();
  $('gear').textContent=i==null?'–':(i+1);
  $('gearOf').textContent='/ '+(n+1);
  $('barFill').style.width=i==null?'0':((i/n)*100)+'%';
  $('down').disabled=!cp||i==null||i<=0;
  $('up').disabled=!cp||i==null||i>=n;
}
function encode(raw,f){
  if(f==='s16'){const b=new DataView(new ArrayBuffer(3));b.setUint8(0,0x04);b.setInt16(1,raw,true);return b.buffer;}
  if(f==='u8')return new Uint8Array([0x04,Math.max(0,Math.min(255,raw))]).buffer;
  return new Uint8Array([0x04,Math.max(0,Math.min(255,Math.round(raw/10)))]).buffer; // u8raw
}
function waitResp(op){return new Promise(res=>{pending={op,res};setTimeout(()=>{if(pending&&pending.op===op){pending=null;res(null);}},1500);});}
async function cpWrite(buf){const op=new Uint8Array(buf)[0];const p=waitResp(op);await cp.writeValueWithResponse(buf);return p;}
async function setLevel(raw){
  raw=Math.max(range.min,Math.min(range.max,raw));
  const order=fmt!=='auto'?[fmt]:(fmtWorking?[fmtWorking]:['s16','u8','u8raw']);
  for(const f of order){
    try{
      const r=await cpWrite(encode(raw,f));
      log('기어 → '+raw+' ('+f+') 응답 '+(r==null?'없음':r));
      if(r===1||r==null){fmtWorking=f;level=raw;render();return;}
    }catch(e){log('쓰기 실패: '+e.message);}
  }
  log('자전거가 기어 명령을 거부했어요. 설정에서 형식을 바꿔보세요.');
}
let busy=false;
async function shift(d){if(busy||level==null)return;busy=true;try{await setLevel(level+d*range.inc);}finally{busy=false;}}
$('up').onclick=()=>shift(1);
$('down').onclick=()=>shift(-1);
$('fmt').onchange=e=>{fmt=e.target.value;fmtWorking=null;try{localStorage.setItem('fmt',fmt);}catch(_){}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')shift(1);if(e.key==='ArrowDown')shift(-1);});

// ---- data parsing (FTMS Indoor Bike Data) ----
function onBike(e){
  const v=e.target.value; let o=2; const f=v.getUint16(0,true);
  if(!(f&1)){st.speed=v.getUint16(o,true)/100;o+=2;}
  if(f&2)o+=2;
  if(f&4){st.cad=v.getUint16(o,true)/2;o+=2;}
  if(f&8)o+=2;
  if(f&16){st.dist=(v.getUint16(o,true)|(v.getUint8(o+2)<<16))/1000;st.hasDist=true;o+=3;}
  if(f&32){o+=2;}
  if(f&64){st.pow=v.getInt16(o,true);o+=2;}
  if(f&128)o+=2;
  if(f&256){const k=v.getUint16(o,true);if(k!==0xffff)st.kcal=k;st.hasKcal=k!==0xffff;o+=5;}
  if(f&512)o+=1;
  if(f&1024)o+=1;
  if(f&2048){st.bikeTime=v.getUint16(o,true);o+=2;}
}
function onCp(e){
  const v=e.target.value;
  if(v.getUint8(0)===0x80&&pending&&pending.op===v.getUint8(1)){const p=pending;pending=null;p.res(v.getUint8(2));}
}
function tick(){
  const now=Date.now();
  if(t0==null)return;
  if(lastTick)distLocal+=st.speed*(now-lastTick)/3600000;
  lastTick=now;
  const sec=st.bikeTime??Math.floor((now-t0)/1000);
  $('time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  $('speed').textContent=st.speed.toFixed(1);
  $('cad').textContent=Math.round(st.cad);
  $('pow').textContent=Math.max(0,st.pow);
  $('dist').textContent=(st.hasDist?st.dist:distLocal).toFixed(2);
  // 파워가 있으면 kcal ≈ 일(kJ) × 1.0 (사람 효율 약 24% 기준 근사)
  if(!st.hasKcal){st.kcalAcc=(st.kcalAcc||0)+Math.max(0,st.pow)*(1/1000);st.kcal=st.kcalAcc;}
  $('kcal').textContent=Math.round(st.kcal);
}
setInterval(tick,1000);
$('reset').onclick=()=>{t0=Date.now();distLocal=0;st.kcalAcc=0;st.bikeTime=null;log('기록 초기화');tick();};

// ---- connect ----
async function connect(){
  try{
    setStatus('자전거 찾는 중…');
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[FTMS]}],optionalServices:[FTMS]});
    dev.addEventListener('gattserverdisconnected',onDisc);
    setStatus('연결 중…');
    const srv=await dev.gatt.connect();
    const s=await srv.getPrimaryService(FTMS);
    try{
      const r=await(await s.getCharacteristic(C_RANGE)).readValue();
      range={min:r.getInt16(0,true),max:r.getInt16(2,true),inc:Math.max(1,r.getUint16(4,true))};
      log('기어 범위 '+range.min+'~'+range.max+' (간격 '+range.inc+')');
    }catch(e){log('기어 범위 읽기 실패, 기본값 사용');}
    // 단계가 너무 잘게 나뉘면 약 24단으로 묶기
    if(steps()>32)range.inc=Math.ceil((range.max-range.min)/24);
    const bike=await s.getCharacteristic(C_BIKE);
    bike.addEventListener('characteristicvaluechanged',onBike);
    await bike.startNotifications();
    cp=await s.getCharacteristic(C_CP);
    cp.addEventListener('characteristicvaluechanged',onCp);
    await cp.startNotifications();
    log('제어권 요청 응답 '+await cpWrite(new Uint8Array([0x00]).buffer));
    log('시작 응답 '+await cpWrite(new Uint8Array([0x07]).buffer));
    setStatus(dev.name||'연결됨','on');
    $('connect').hidden=true;$('disc').disabled=false;
    t0=t0??Date.now();lastTick=Date.now();
    await setLevel(level??range.min);
    try{wake=await navigator.wakeLock?.request('screen');}catch(_){}
  }catch(e){
    log('오류: '+e.message);
    setStatus(e.name==='NotFoundError'?'선택 취소됨':'연결 실패','err');
  }
  render();
}
function onDisc(){
  cp=null;setStatus('연결 끊김','err');$('connect').hidden=false;$('connect').textContent='다시 연결';
  $('disc').disabled=true;st.speed=0;st.cad=0;st.pow=0;render();log('연결이 끊겼어요');
}
$('connect').onclick=connect;
$('disc').onclick=()=>{try{dev?.gatt?.disconnect();}catch(_){}}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&cp){try{wake=await navigator.wakeLock?.request('screen');}catch(_){}}});
render();
</script>
</body>
</html>
